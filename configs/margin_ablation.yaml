# Real-model yaw-sweep margin ablation (follow-up 2 item 1).

schema_version: "1"

seed: 42
n_frames_per_walk:
  walk1: 2
  images: 2
source_frames: >
  seeded stratified; frames must have ≥1 detection at baseline margin=15°
  with persam before inclusion

margins_deg: [0.0, 5.0, 15.0]
baseline_margin_deg: 15.0

# Cover face centres (0), near edges (~45), corners, and ±180 wrap (180)
yaw_offsets_deg: [0.0, 15.0, 30.0, 45.0, 60.0, 75.0, 90.0, 180.0]
source_yaw: >
  my decision — 0/90 face-centres for F/R; 45 edge/corner; 180 wrap seam;
  15/30/60/75 intermediate

face_size: 1024
face_size_basis: rationale_sam_native  # not evidence-based until labels

models: [persam, persam_f, seggpt]

# Matching a detection to baseline in world frame after undoing yaw
match_angular_deg: 3.0
source_match: >
  my decision — 6× min_instance_angular_width_deg (0.5°); tighter than
  typical inter-nail (~5.7° at 2 m / 20 m)

paths:
  out_dir: outputs/pilot_cubemap/margin_yaw_sweep
