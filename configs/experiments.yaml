# Experiment matrix for pilot + full-run baseline selection.

schema_version: "1"

time_budget_hours: 8.0
source_budget: "spec Gate 2 — proceed automatically if baseline full run ≤ 8h"

pilot:
  size: 48
  source: >
    my decision — ~8% of 591 images; stratified by archive
    (images:8, walk1:40) for runtime/VRAM estimates without full spend
  seed: 42
  source_seed: "configs/project.yaml global_seed"

label_sample:
  size: 80
  source: >
    my decision — later review queue; ~14% of dataset, split by walk/archive
    clusters into tuning/heldout (Phase 4)

references:
  single:
    - nail_ref_01_2D12_rebar_install
    - nail_ref_02_2D16_rebar_install
    - nail_ref_03_2D17_depth_measure
  ensemble: all
  paths:
    images_dir: data/refs/soil_nail/images
    masks_dir: data/refs/soil_nail/masks

models:
  - persam
  - persam_f
  - seggpt

# Pilot sweeps these; full run uses baseline only unless estimate allows more.
pilot_grid:
  scales:
    - name: whole
      tiling: false
      tile_px: null
    - name: tile_1024
      tiling: true
      tile_px: 1024
    - name: tile_1536
      tiling: true
      tile_px: 1536
  refs_modes:
    - single_each
    - ensemble
  instance_mode: true
  tight_prompt_crop_ablation: true
  source: >
    tiling sizes from configs/models.yaml (SAM 1024; 1536 for 3840-wide frames);
    tight crop ablation only (hurt LOO)

baseline_full_run:
  refs_mode: ensemble
  instance_mode: true
  scales:
    - whole
    - tile_1024
  models:
    - persam
    - persam_f
    - seggpt
  tight_prompt_crop: false
  source: "spec Phase 3 baseline definition"

paths:
  models_config: configs/models.yaml
  manifest_sqlite: data/manifests/dataset.sqlite
  extract_root: data/site_walk_extracted
  pilot_out: outputs/pilot
  runs_out: outputs/runs
